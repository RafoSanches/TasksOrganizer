<app-header></app-header>

<div class="cabecalho-secundario text-white text-center py-2">
  <h5 class="mb-0">Tarefas - {{ today | date:'d MMMM yyyy' }}</h5>
</div>

<div class="container-fluid py-3">
  <div class="d-flex justify-content-end mb-3 px-2">
    <button class="btn btn-primary btn-sm" [routerLink]="['/tarefa-nova']">
      Adicionar <i class="bi bi-plus-circle"></i>
    </button>
  </div>

  <div *ngIf="tarefas.length === 0" class="text-center text-muted mt-5">
    <i class="bi bi-clipboard2 fs-1"></i>
    <p class="mt-2">Nenhuma tarefa cadastrada.</p>
  </div>

  <div class="d-flex flex-column align-items-center gap-3">
    <div *ngFor="let tarefa of tarefas" class="card cartao-tarefa">
      <div class="card-body p-3">
        <p [class]="getPrioridadeClass(tarefa.prioridade)" class="mb-1">
          {{ tarefa.prioridade }}
        </p>
        <p class="mb-1">
          <i class="bi bi-circle-fill me-1 icone-bolinha"></i>
          {{ tarefa.nome }}
        </p>
        <p class="text-muted small mb-1">
          Vencimento {{ tarefa.data | date:"EEEE, d 'de' MMMM 'de' yyyy":'UTC' }}
        </p>
        <p class="texto-categoria mb-2">{{ tarefa.categoria }}</p>
        <div class="d-flex gap-2">
          <button class="btn btn-warning btn-sm" (click)="editar(tarefa.id)">
            Editar <i class="bi bi-pencil-square"></i>
          </button>
          <button class="btn btn-danger btn-sm" (click)="deletar(tarefa.id)">
            Deletar <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
