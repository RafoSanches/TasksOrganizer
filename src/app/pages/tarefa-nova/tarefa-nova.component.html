<app-header></app-header>

<div class="cabecalho-secundario text-white text-center py-2">
  <h5 class="mb-0">Nova Tarefa</h5>
</div>

<div class="container-fluid py-3 px-4">

  <div class="mb-3">
    <label class="form-label rotulo-campo">Nome</label>
    <input
      type="text"
      class="form-control campo-formulario"
      placeholder="Informe a tarefa"
      [(ngModel)]="tarefa.nome"
    >
  </div>

  <div class="mb-3">
    <label class="form-label rotulo-campo">Prioridade</label>
    <select class="form-select campo-formulario" [(ngModel)]="tarefa.prioridade">
      <option value="" disabled>Selecione</option>
      <option value="Alto">Alto</option>
      <option value="Médio">Médio</option>
      <option value="Baixo">Baixo</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label rotulo-campo">Data limite</label>
    <input
      type="date"
      class="form-control campo-formulario"
      [(ngModel)]="tarefa.data"
    >
  </div>

  <div class="mb-2">
    <label class="form-label rotulo-campo">Categoria</label>
    <input
      type="text"
      class="form-control campo-formulario"
      [(ngModel)]="tarefa.categoria"
      readonly
    >
  </div>

  <div class="d-flex gap-2 mb-4">
    <button class="btn btn-outline-secondary btn-sm" (click)="setCategoria('domestico')">domestico</button>
    <button class="btn btn-outline-secondary btn-sm" (click)="setCategoria('pessoal')">pessoal</button>
    <button class="btn btn-outline-secondary btn-sm" (click)="setCategoria('trabalho')">trabalho</button>
  </div>

  <button class="btn btn-success btn-sm" (click)="salvar()">Salvar</button>

</div>
